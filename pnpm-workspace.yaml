packages:
  - 'packages/*'

# Native and prebuilt-fetching packages, which pnpm will not run install scripts
# for unless they are named here. `node-pty` is optional - the terminals port
# falls back to pipes without it - and esbuild is vitest's bundler.
allowBuilds:
  # Both arrive with pi and neither is needed for it to load: `@google/genai`'s
  # preinstall is a literal no-op, and protobufjs's postinstall is codegen its
  # runtime does without. Naming them false is the decision, not a deferral -
  # pnpm asks about a script it will not run silently.
  '@google/genai': false
  bufferutil: false
  es5-ext: false
  esbuild: true
  koffi: false
  node-pty: true
  protobufjs: false
  utf-8-validate: false

overrides:
  # The sandbox runtime allows zod 3 or 4; only zod 4.6.6 has the fix for
  # GHSA-mrhx-c7xc-m3w5, and the runtime's `zod/v3` imports work under it.
  '@ahpio/sandbox-runtime>zod': ^4.6.6
  # The private source package keeps a workspace dependency in its monorepo.
  # This consumer supplies the same released lock implementation explicitly.
  '@bearly/durable-file>@bearly/flock': '0.2.3'

minimumReleaseAgeExclude:
  - '@microsoft/agent-host-protocol@1.0.0 || 1.1.0'
  - '@cofold/agents@0.4.0 || 0.4.1'
  - '@cofold/commands@0.2.2 || 0.3.0'
  - '@cofold/mcp-client@0.2.0'
  - '@cofold/model-openai-compat@0.2.1 || 0.3.0'
  - '@cofold/remote@0.4.0 || 0.5.0'
  - '@cofold/sdk@0.2.0'
  - '@cofold/store-file@0.2.2'
  - '@cofold/tools@0.4.1 || 0.4.2'
  - '@cofold/config@0.3.0 || 0.3.1'
  - '@cofold/terminal@0.3.0 || 0.4.0 || 0.5.0 || 0.5.1'
  - '@cofold/yaml@0.3.0'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.325'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.325'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.325'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.325'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.325'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.325'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.325'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.325'
  - '@anthropic-ai/claude-agent-sdk@0.3.325'
  - '@earendil-works/pi-agent-core@1.5.2'
  - '@earendil-works/pi-ai@1.5.2'
  - '@earendil-works/pi-codemode@1.5.2'
  - '@earendil-works/pi-coding-agent@1.5.2'
  - '@earendil-works/pi-mcp@1.5.2'
  - '@earendil-works/pi-telemetry@1.5.2'
  - '@earendil-works/pi-tui@1.5.2'
  - '@ahpio/sandbox-runtime@0.0.83'
